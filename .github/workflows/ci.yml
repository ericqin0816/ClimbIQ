name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  production-workflows:
    name: Production workflows (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium
            os: ubuntu-24.04
            browser: chromium
            projects: --project=chromium
          - name: WebKit and phone viewport
            os: macos-15
            browser: webkit
            projects: --project=webkit --project=webkit-phone
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Build the shipped app
        run: npm run build
      - name: Import, review, save, compare and recover
        run: npx playwright test ${{ matrix.projects }}
      - name: Keep production workflow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-workflow-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependency tree
        run: npm audit --omit=dev

      - name: Check iOS source configuration
        run: npm run ios:check

      - name: Prepare synthetic video encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          google-chrome --version
          ffmpeg -version

      - name: Verify encoded source-frame timing in Chrome
        env:
          CLIMBIQ_CHROME: /usr/bin/google-chrome
          CLIMBIQ_FFMPEG: ffmpeg
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/climbiq-vite.log 2>&1 &
          CLIMBIQ_VITE_PID=$!
          trap 'kill "$CLIMBIQ_VITE_PID" || true' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/ >/dev/null
          npm run test:browser-harness
          npm run test:pose-worker-build
          npm run test:coaching
          npm run test:coaching-save-recovery
          npm run test:mobile-library
          npm run test:library-concurrency
          npm run test:video-attachment
          npm run test:biomechanics-ownership
          # Repetition catches decoder/readback races; a failure stops the step.
          for pass in 1 2 3; do
            npm run test:source-frames
          done

      - name: Keep synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            test-results/*.json
            test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
