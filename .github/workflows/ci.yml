name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  production-workflows:
    name: Production workflows (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Chromium
            os: ubuntu-24.04
            browser: chromium
            projects: --project=chromium --project=chromium-phone
          - name: WebKit and phone viewport
            os: macos-15
            browser: webkit
            projects: --project=webkit --project=webkit-phone
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify native lane-light Finish in WebKit
        if: matrix.browser == 'webkit'
        env:
          CLIMBIQ_E2E_BROWSER: webkit
          CLIMBIQ_E2E_URL: http://127.0.0.1:5197/
        run: |
          if command -v ffmpeg >/dev/null; then
            export CLIMBIQ_FFMPEG=$(command -v ffmpeg)
          else
            python3 -m venv "$RUNNER_TEMP/climbiq-finish-encoder"
            "$RUNNER_TEMP/climbiq-finish-encoder/bin/python" -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
            export CLIMBIQ_FFMPEG=$("$RUNNER_TEMP/climbiq-finish-encoder/bin/python" -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          fi
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5197 --strictPort >"$RUNNER_TEMP/climbiq-webkit-finish-vite.log" 2>&1 &
          CLIMBIQ_VITE_PID=$!
          trap 'kill "$CLIMBIQ_VITE_PID" 2>/dev/null || true; wait "$CLIMBIQ_VITE_PID" 2>/dev/null || true' EXIT
          CLIMBIQ_VITE_READY=false
          for attempt in {1..30}; do
            kill -0 "$CLIMBIQ_VITE_PID" || { cat "$RUNNER_TEMP/climbiq-webkit-finish-vite.log"; exit 1; }
            if lsof -nP -a -p "$CLIMBIQ_VITE_PID" -iTCP:5197 -sTCP:LISTEN >/dev/null && curl --fail --silent http://127.0.0.1:5197/src/lib/detectFinishSignal.ts >/dev/null; then
              CLIMBIQ_VITE_READY=true
              break
            fi
            sleep 1
          done
          test "$CLIMBIQ_VITE_READY" = true
          npm run test:finish-baseline
      - name: Build the shipped app
        run: npm run build
      - name: Import, review, save, compare and recover
        run: npx playwright test ${{ matrix.projects }}
      - name: Keep production workflow evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-workflow-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependency tree
        run: npm audit --omit=dev

      - name: Check iOS source configuration
        run: npm run ios:check

      - name: Prepare synthetic video encoder
        run: |
          if command -v ffmpeg >/dev/null; then
            CLIMBIQ_FFMPEG_PATH=$(command -v ffmpeg)
          else
            python -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
            CLIMBIQ_FFMPEG_PATH=$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
          fi
          echo "CLIMBIQ_FFMPEG=$CLIMBIQ_FFMPEG_PATH" >> "$GITHUB_ENV"
          google-chrome --version
          "$CLIMBIQ_FFMPEG_PATH" -version

      - name: Verify encoded source-frame timing in Chrome
        env:
          CLIMBIQ_CHROME: /usr/bin/google-chrome
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/climbiq-vite.log 2>&1 &
          CLIMBIQ_VITE_PID=$!
          trap 'kill "$CLIMBIQ_VITE_PID" || true' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/ >/dev/null
          npm run test:browser-harness
          npm run test:pose-worker-build
          npm run test:coaching
          npm run test:coaching-save-recovery
          npm run test:mobile-library
          npm run test:library-concurrency
          npm run test:video-attachment
          npm run test:biomechanics-ownership
          npm run test:finish-baseline
          # Repetition catches decoder/readback races; a failure stops the step.
          for pass in 1 2 3; do
            npm run test:source-frames
          done

      - name: Keep synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-evidence
          path: |
            test-results/*.json
            test-results/*.png
            test-results/finish-source-baseline/**/*.json
          if-no-files-found: ignore
          retention-days: 7
