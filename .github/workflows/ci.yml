name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit production dependency tree
        run: npm audit --omit=dev

      - name: Prepare synthetic video encoder
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          google-chrome --version
          ffmpeg -version

      - name: Verify encoded source-frame timing in Chrome
        env:
          CLIMBIQ_CHROME: /usr/bin/google-chrome
          CLIMBIQ_FFMPEG: ffmpeg
        run: |
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort >/tmp/climbiq-vite.log 2>&1 &
          CLIMBIQ_VITE_PID=$!
          trap 'kill "$CLIMBIQ_VITE_PID" || true' EXIT
          curl --fail --silent --retry 30 --retry-connrefused --retry-delay 1 http://127.0.0.1:5173/ >/dev/null
          # Repetition catches decoder/readback races; a failure stops the step.
          for pass in 1 2 3; do
            npm run test:source-frames
          done
